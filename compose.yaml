version: '3.8'

services:

  application:
    build: .
    container_name: nhom03_application
    ports:
      - "8080:80"
    environment:
      - DB_HOST=database
    networks:
      - cloud-project-network

  database:
    image: mysql:8.0
    container_name: nhom03_database
    environment:
      MYSQL_DATABASE: do_an_cuoi_ky
      MYSQL_USER: projectuser
      MYSQL_PASSWORD: change_this_password
      MYSQL_ROOT_PASSWORD: change_this_password
    volumes:
      - database-data:/var/lib/mysql
      - ./do_an_cuoi_ky.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cloud-project-network

  minio:
    image: rancher/mirrored-minio-minio:RELEASE.2020-07-13T18-09-56Z
    container_name: nhom03_minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: change_this_password
    volumes:
      - minio-data:/data
    networks:
      - cloud-project-network

  # --- THÊM PHẦN NÀY ĐỂ CHẠY PHPMYADMIN ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: nhom03_phpmyadmin
    environment:
      PMA_HOST: database
      MYSQL_ROOT_PASSWORD: change_this_password
    ports:
      - "8081:80"
    networks:
      - cloud-project-network

volumes:
  database-data:
    name: database-data
  minio-data:
    name: minio-data

networks:
  cloud-project-network:
    name: cloud-project-network
    driver: bridge